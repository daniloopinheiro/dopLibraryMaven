# ================================
# Render.com Configuration
# Biblioteca API
# ================================

services:
  # Web Service (API)
  - type: web
    name: doplibrarymaven
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    region: oregon # ou sua região preferida: oregon, frankfurt, singapore
    plan: free # ou starter, standard, pro
    
    # Branch configuration
    branch: main
    
    # Build configuration
    buildFilter:
      paths:
        - src/**
        - pom.xml
        - Dockerfile.render
    
    # Environment variables
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      
      # Database Configuration - Render PostgreSQL (External Host)
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-d46j4c0dl3ps73bo34t0-a.oregon-postgres.render.com:5432/doplibrarymaven
      
      - key: SPRING_DATASOURCE_USERNAME
        value: admin
      
      - key: SPRING_DATASOURCE_PASSWORD
        value: VRE9dZvXjas0sq31sCgdXTMJ3Yldyk1c
      
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      
      # Server configuration
      - key: SERVER_PORT
        value: "8080"
    
    # Health check
    healthCheckPath: /api/autores
    
    # Auto-deploy
    autoDeploy: true

# Database (Already created in Render)
# Using existing database: dpg-d46j4c0dl3ps73bo34t0-a
# Database: doplibrarymaven
# Username: admin

